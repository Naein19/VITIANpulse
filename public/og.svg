    <rect x="232" width="176" height="42" rx="7" fill="none" stroke="#c2c2b6" stroke-width="1.5"/>
    <text x="256" y="28" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="600"
          fill="#3d3e35">Built by students</text>
