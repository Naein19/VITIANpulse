          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="180" y="150" font-family="Inter, system-ui, sans-serif" font-size="46" font-weight="800"
        letter-spacing="-1.6" fill="#15150f">VIT<tspan fill="#5b3df5">Pulse</tspan></text>

  <text x="88" y="300" font-family="Inter, system-ui, sans-serif" font-size="78" font-weight="800"
        letter-spacing="-3.2" fill="#15150f">Everything happening</text>
  <text x="88" y="388" font-family="Inter, system-ui, sans-serif" font-size="78" font-weight="800"
