<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#dcdcd3" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f1ec" stop-opacity="0"/>
      <stop offset="100%" stop-color="#f1f1ec" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#f1f1ec"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.85"/>
  <rect width="1200" height="630" fill="url(#fade)"/>

  <g transform="translate(88 96)">
    <rect width="72" height="72" rx="17" fill="#15150f"/>
    <path d="M12 40h8l5.2-14.2L33 47l6.5-15.3L43.6 40H61"
